<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TritonTube — Video Library</title><link rel="stylesheet" href="/static/style.css"><script src="/static/library.js" defer></script></head>
<body><header><a class="brand" href="/">◒ TritonTube</a><a href="/healthz">Cluster health ↗</a></header><main><section class="intro"><span class="eyebrow">DISTRIBUTED VIDEO HOSTING</span><h1>Your stories.<br>Ready to stream.</h1><p>Upload once. Watch with adaptive quality.<br>Powered by a cluster of independent storage nodes.</p></section>
